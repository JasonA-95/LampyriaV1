<style>
:root{--bg:#120d1a;--panel:#221a35;--panel2:#2c2244;--line:#3f3360;--ink:#f3e9d8;--dim:#a99bb8;--ember:#ffb454;--ok:#7fd18b;--bad:#ff7b6b;--blue:#6fb7ff;color-scheme:dark;
